<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KazuArt — redirect</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: radial-gradient(1200px 600px at 20% -10%, #163a66, transparent),
                  radial-gradient(900px 500px at 100% 100%, #0b2a4a, #071018);
      color: #d7e7ff;
    }
    .box { text-align: center; max-width: 420px; padding: 32px; }
    h1 { letter-spacing: .18em; font-weight: 600; font-size: 14px; color: #6cb6ff; }
    p { opacity: .8; }
    .pulse { width: 12px; height: 12px; border-radius: 50%; background: #3d9eff;
      margin: 18px auto; animation: p 1.2s ease-in-out infinite; }
    @keyframes p { 50% { transform: scale(1.6); opacity: .4; } }
    a { color: #7ec4ff; }
  </style>
</head>
<body>
  <div class="box">
    <h1>KAZUART</h1>
    <div class="pulse"></div>
    <p id="msg">Looking up the live server address…</p>
  </div>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDPlFVk87LUqpSXHEAbFnNLealgk7zHVa0",
      authDomain: "kazuart-5abfa.firebaseapp.com",
      databaseURL: "https://kazuart-5abfa-default-rtdb.firebaseio.com",
      projectId: "kazuart-5abfa",
      storageBucket: "kazuart-5abfa.firebasestorage.app",
      messagingSenderId: "108772320563",
      appId: "1:108772320563:web:3b82612576ef28368aca46",
      measurementId: "G-MJLE6KDPGZ"
    };
    const FIREBASE_DB_URL = firebaseConfig.databaseURL;
    const PATH = "/tunnel.json";

    async function go() {
      const msg = document.getElementById("msg");
      try {
        if (FIREBASE_DB_URL.includes("YOUR_PROJECT")) {
          msg.innerHTML = "Set FIREBASE_DB_URL in <code>index.html</code> first.";
          return;
        }
        const res = await fetch(FIREBASE_DB_URL.replace(/\/$/, "") + PATH);
        const data = await res.json();
        const url = data && data.url;
        if (!url) {
          msg.textContent = "Tunnel is not published yet. Run start.bat on the artist machine.";
          setTimeout(go, 4000);
          return;
        }
        msg.textContent = "Redirecting to " + url;
        location.replace(url);
      } catch (e) {
        msg.textContent = "Firebase is unreachable. Check rules and URL.";
        setTimeout(go, 5000);
      }
    }
    go();
  </script>
</body>
</html>
